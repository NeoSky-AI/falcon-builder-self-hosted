# Falcon Builder — self-hosted (Community edition)
#
# Read README.md first. Configure with ./setup.sh (writes .env), then:
#   docker compose up -d
#
# Services: caddy (TLS + reverse proxy) → web; worker; scheduler (the cron
# jobs); migrate (one-shot schema step); postgres (pgvector); redis; and, with
# the `storage` profile (on by default), storage (SeaweedFS). Only caddy
# publishes ports. Everything reads .env; the values derived from it are set
# under `environment` below.

name: falcon

x-app-env: &app-env
  FALCON_EDITION: community
  NEXT_PUBLIC_FALCON_EDITION: community
  NODE_ENV: production
  APP_URL: ${APP_URL}
  NEXT_PUBLIC_APP_URL: ${APP_URL}
  DATABASE_URL: postgresql://falcon:${POSTGRES_PASSWORD}@postgres:5432/falcon
  DIRECT_URL: postgresql://falcon:${POSTGRES_PASSWORD}@postgres:5432/falcon
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: falcon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: falcon
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon -d falcon"]
      interval: 5s
      timeout: 5s
      retries: 24

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 24

  # Bundled S3-compatible storage. Drop `storage` from COMPOSE_PROFILES and
  # point STORAGE_S3_* at your own bucket to use S3, R2, … instead
  # (docs/storage.md).
  #
  # Bundled S3-compatible storage (SeaweedFS).
  #
  # This was MinIO until 2026-09-26. MinIO archived its community edition and
  # withdrew the public images: the `minio` Docker Hub namespace went first
  # (Sept 2026), we repointed to quay.io, and quay stopped serving them too on
  # 2026-09-24. Every fresh `docker compose pull` failed with "unauthorized".
  # SeaweedFS is Apache-2.0 and serves the same S3 API this stack already
  # speaks. See UPGRADING.md if you have files in the old minio-data volume.
  #
  # One process runs master, volume, filer and the S3 gateway. The bucket is
  # created on first upload (-s3.autoCreateBucket, admin identity), so unlike
  # MinIO there is no init container to wait on.
  storage:
    image: chrislusf/seaweedfs:4.47
    profiles: [storage]
    restart: unless-stopped
    networks:
      default:
        # .env files written before the switch still say http://minio:9000.
        aliases: [minio]
    environment:
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY}
      # Browsers upload straight to the bucket from the app's origin.
      APP_URL: ${APP_URL}
    # The credentials live in .env, so the identities file is rendered at
    # start rather than committed or generated by setup.sh — nothing to keep
    # in sync, and `docker compose up -d` is enough after changing them.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<JSON
        { "identities": [ {
            "name": "falcon",
            "credentials": [ { "accessKey": "$${STORAGE_S3_ACCESS_KEY_ID}", "secretKey": "$${STORAGE_S3_SECRET_ACCESS_KEY}" } ],
            "actions": [ "Admin", "Read", "Write", "List", "Tagging" ]
        } ] }
        JSON
        exec weed server -dir=/data -s3 -s3.port=9000 \
          -s3.config=/etc/seaweedfs/s3.json \
          -s3.allowedOrigins="$${APP_URL}"
    volumes:
      # Deliberately not minio-data: MinIO's on-disk layout is not readable
      # here, and keeping the old volume leaves your files recoverable.
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9000/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Creates the pgvector extension and applies the schema. Runs once per
  # `up`; web and worker wait for it. Idempotent.
  migrate:
    image: ${FALCON_WORKER_IMAGE:-ghcr.io/neosky-ai/falcon-builder-worker}:${FALCON_VERSION:-latest}
    restart: "no"
    command: falcon-migrate
    env_file: .env
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${FALCON_WEB_IMAGE:-ghcr.io/neosky-ai/falcon-builder-web}:${FALCON_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # Storage must answer before the app hands out upload links. Ignored
      # when the storage profile is off (your own bucket already exists).
      storage:
        condition: service_healthy
        required: false
    # No ports: caddy fronts it. The image's own HEALTHCHECK applies.

  worker:
    image: ${FALCON_WORKER_IMAGE:-ghcr.io/neosky-ai/falcon-builder-worker}:${FALCON_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The scheduled jobs (schedule triggers, HITL timeouts, log retention, …):
  # the same eight schedules the cloud edition runs, calling the app's
  # /api/cron/* endpoints with CRON_SECRET. See crontab.template.
  scheduler:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
    volumes:
      - ./crontab.template:/crontab.template:ro
    command: >
      /bin/sh -c '
      apk add --no-cache curl >/dev/null &&
      sed "s#__CRON_SECRET__#$$CRON_SECRET#g" /crontab.template > /etc/crontabs/root &&
      exec crond -f -l 8'
    depends_on:
      web:
        condition: service_healthy

  # TLS and routing. Site addresses come from APP_URL and STORAGE_URL in .env;
  # certificates are obtained and renewed automatically for https:// ones.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL}
      STORAGE_URL: ${STORAGE_URL}
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
      - "${STORAGE_PORT:-9000}:${STORAGE_PORT:-9000}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  postgres-data:
  redis-data:
  storage-data:
  # minio-data is intentionally undeclared: instances that predate the
  # SeaweedFS switch keep it (and their files) until they migrate. See
  # UPGRADING.md; `docker compose down -v` will not remove it.
  caddy-data:
  caddy-config:
