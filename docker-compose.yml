# Falcon Builder — self-hosted (Community edition)
#
# Read README.md first. Configure with ./setup.sh (writes .env), then:
#   docker compose up -d
#
# Services: caddy (TLS + reverse proxy) → web; worker; scheduler (the cron
# jobs); migrate (one-shot schema step); postgres (pgvector); redis; and, with
# the `storage` profile (on by default), minio + minio-init. Only caddy
# publishes ports. Everything reads .env; the values derived from it are set
# under `environment` below.

name: falcon

x-app-env: &app-env
  FALCON_EDITION: community
  NEXT_PUBLIC_FALCON_EDITION: community
  NODE_ENV: production
  APP_URL: ${APP_URL}
  NEXT_PUBLIC_APP_URL: ${APP_URL}
  DATABASE_URL: postgresql://falcon:${POSTGRES_PASSWORD}@postgres:5432/falcon
  DIRECT_URL: postgresql://falcon:${POSTGRES_PASSWORD}@postgres:5432/falcon
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: falcon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: falcon
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon -d falcon"]
      interval: 5s
      timeout: 5s
      retries: 24

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 24

  # Bundled S3-compatible storage. Drop `storage` from COMPOSE_PROFILES and
  # point STORAGE_S3_* at your own bucket to use S3, R2, … instead
  # (docs/storage.md).
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: [storage]
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Browsers upload straight to the bucket from the app's origin.
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_URL}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 24

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    profiles: [storage]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET}
    entrypoint: >
      /bin/sh -c '
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null &&
      mc mb --ignore-existing "local/$$STORAGE_S3_BUCKET"'

  # Creates the pgvector extension and applies the schema. Runs once per
  # `up`; web and worker wait for it. Idempotent.
  migrate:
    image: ${FALCON_WORKER_IMAGE:-ghcr.io/neosky-ai/falcon-builder-worker}:${FALCON_VERSION:-latest}
    restart: "no"
    command: falcon-migrate
    env_file: .env
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${FALCON_WEB_IMAGE:-ghcr.io/neosky-ai/falcon-builder-web}:${FALCON_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # The bucket must exist before the app hands out upload links. Ignored
      # when the storage profile is off (your own bucket already exists).
      minio-init:
        condition: service_completed_successfully
        required: false
    # No ports: caddy fronts it. The image's own HEALTHCHECK applies.

  worker:
    image: ${FALCON_WORKER_IMAGE:-ghcr.io/neosky-ai/falcon-builder-worker}:${FALCON_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The scheduled jobs (schedule triggers, HITL timeouts, log retention, …):
  # the same eight schedules the cloud edition runs, calling the app's
  # /api/cron/* endpoints with CRON_SECRET. See crontab.template.
  scheduler:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
    volumes:
      - ./crontab.template:/crontab.template:ro
    command: >
      /bin/sh -c '
      apk add --no-cache curl >/dev/null &&
      sed "s#__CRON_SECRET__#$$CRON_SECRET#g" /crontab.template > /etc/crontabs/root &&
      exec crond -f -l 8'
    depends_on:
      web:
        condition: service_healthy

  # TLS and routing. Site addresses come from APP_URL and STORAGE_URL in .env;
  # certificates are obtained and renewed automatically for https:// ones.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL}
      STORAGE_URL: ${STORAGE_URL}
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
      - "${STORAGE_PORT:-9000}:${STORAGE_PORT:-9000}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
